services:
  - type: web
    name: hindidubanime-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SOURCE_BASE_URL
        value: https://hindidubanime.com
      - key: HOMEPAGE_PATH
        value: /homepage/
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: DETAILS_CACHE_TTL_SECONDS
        value: "1800"
      - key: PLAYER_CACHE_TTL_SECONDS
        value: "180"
      - key: CORS_ORIGINS
        value: "*"
